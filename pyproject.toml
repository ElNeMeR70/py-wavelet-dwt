[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-wavelet-dwt"
version = "1.0.0"
description = "Discrete Wavelet Transform with Daubechies wavelets"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "dwt", "wavelet", "signal-processing", "scientific"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-wavelet-dwt"
Repository = "https://github.com/ElNeMeR70/py-wavelet-dwt"
